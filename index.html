<style>
:root{--bg:#f5f3ef;--paper:#fffefa;--ink:#4d514e;--soft:#7d837e;--line:#e5e4dd;--accent:#9bafa3;--shade:#edf0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:1560px;margin:auto;padding:34px 28px 80px}.header{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.22em;color:#84978b;font-weight:700}h1{font-size:34px;letter-spacing:.05em;margin:6px 0 4px}p{margin:0;color:var(--soft);font-size:15px;line-height:1.5}.toolbar,.subtoolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #dcded8;background:var(--paper);border-radius:10px;color:var(--ink);padding:11px 15px;font-size:15px;font-weight:600}.btn:hover{background:#eff1eb}.btn.primary{background:#829e90;color:white;border-color:#829e90}.btn.danger{color:#ad716b}.year{width:96px;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink);text-align:center;font-size:15px}.panel{background:var(--paper);border:1px solid #e8e6df;border-radius:20px;padding:22px;box-shadow:0 10px 28px #666b5b0b}.subtoolbar{justify-content:space-between;margin-bottom:18px}.dimension-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 0 18px;color:#697b70;font-size:14px}.dimension-controls label{display:flex;align-items:center;gap:8px}.dimension-controls input[type=range]{width:145px;accent-color:#829e90}.dimension-controls output{min-width:46px;font-variant-numeric:tabular-nums}.resize-edge{position:absolute;left:calc(var(--name-width,460px) - 6px);width:12px;top:0;bottom:0;cursor:col-resize;z-index:5;touch-action:none}.resize-edge:after{content:"";display:block;position:absolute;left:5px;top:0;bottom:0;border-left:2px solid #c2d0c5;opacity:0}.resize-edge:hover:after,.resize-edge:active:after{opacity:1}.chart-head{position:relative}.hint{font-size:15px;color:#879188;line-height:1.5}.hint b{color:#637e6d}.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:17px;font-size:14px;color:var(--soft);line-height:1.6}.pill{width:10px;height:10px;border-radius:4px;background:#9aafa2;display:inline-block}.scroll{overflow-x:auto;padding-bottom:8px}.chart{min-width:max(1260px,calc(var(--name-width,460px) + 660px))}.chart-head,.chart-row{display:grid;grid-template-columns:var(--name-width,460px) repeat(12,minmax(45px,1fr));align-items:center}.chart-head{border-bottom:1px solid var(--line);padding-bottom:14px;font-size:17px;color:#78847b;font-weight:600}.chart-head>div{text-align:center}.chart-head>div:first-child{text-align:left;padding-left:16px}.chart-row{min-height:var(--row-height,64px);border-bottom:1px solid #efeee9;position:relative}.chart-row:last-child{border-bottom:0}.name-cell{grid-column:1;padding:0 6px;display:flex;align-items:center;gap:6px;z-index:2;height:100%}.project-select{background:transparent;border:1px solid transparent;border-radius:9px;text-align:left;padding:10px 8px;min-width:0;flex:1;color:var(--ink);font-weight:650;font-size:17px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.6}.project-select:hover{background:#f3f4ef}.chart-row.selected .project-select{border-color:#bbcdc2;background:#e9f0e9}.dot{width:12px;height:12px;border-radius:50%;flex:none}.move,.small{border:0;background:transparent;color:#a0a39e;padding:5px;font-size:19px}.move:hover,.small:hover{color:#4b6152;background:#edf0ea;border-radius:5px}.months{grid-column:2 / span 12;display:grid;grid-template-columns:repeat(12,1fr);height:100%;position:relative;align-items:center}.month{border:0;border-left:1px solid #f0efe9;background:transparent;height:100%;z-index:2;padding:0;position:relative}.month:last-of-type{border-right:1px solid #f0efe9}.month:hover{background:#9eae9e17}.bar{pointer-events:none;position:absolute;top:calc(50% - 10px);height:20px;border-radius:999px;z-index:1;box-shadow:inset 0 -2px 1px #0000000a}.chart-row:not(.selected) .month{cursor:pointer}.chart-row.selected .month:hover{background:#9eae9e30}.empty{padding:48px 20px;text-align:center;color:#9b9f99}.editor{margin-top:23px;border:1px solid var(--line);background:#f9faf7;border-radius:14px;padding:17px;display:none}.editor.visible{display:block}.editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.editor-grid{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;font-size:14px;color:#7e857e}.field input{border:1px solid #dcded7;border-radius:8px;padding:10px;background:white;color:var(--ink);font-size:15px}.field input[type=color]{height:38px;width:50px;padding:3px}.field input[type=text]{width:220px}.swatches{display:flex;gap:6px;flex-wrap:wrap;max-width:370px}.swatch{width:28px;height:28px;border-radius:8px;border:2px solid white;outline:1px solid #ddd;cursor:pointer}.foot{margin-top:22px;color:#9b9e98;font-size:13px;line-height:1.8}.tag{display:inline-block;border-radius:20px;padding:5px 12px;background:#e9eee9;color:#74897a;font-size:14px}#export-canvas{display:none}@media(max-width:700px){.app{padding:20px 12px}.panel{padding:13px}.chart{min-width:max(1260px,calc(var(--name-width,460px) + 660px))}h1{font-size:28px}.chart-head{font-size:16px}.project-select{font-size:16px}}@media print{body{background:white}.app{padding:0;max-width:none}.header,.subtoolbar,.dimension-controls,.resize-edge,.editor,.legend,.foot,.move,.small{display:none!important}.panel{border:0;box-shadow:none;padding:0}.scroll{overflow:visible}.chart{min-width:0}.chart-head,.chart-row{grid-template-columns:min(40%,var(--name-width,460px)) repeat(12,1fr)}.month{border-left:1px solid #ddd!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.bar,.dot{print-color-adjust:exact;-webkit-print-color-adjust:exact}.project-select{font-size:13px;white-space:normal;overflow-wrap:anywhere}.chart-row{min-height:var(--row-height,64px);break-inside:avoid}.bar{top:calc(50% - 8px);height:16px}@page{size:A4 landscape;margin:13mm}}

<body><div class="app"><header class="header"><div><div class="eyebrow">PROJECT PLANNER</div><h1>年度專案甘特圖 <span class="tag">My Timeline</span></h1><p>讓每個月的規劃，一目了然。</p></div><div class="toolbar"><label for="year">年份</label><input id="year" class="year" type="number" min="1900" max="2200"><button class="btn primary" id="add">＋ 新增專案</button></div></header><section class="panel"><div class="subtoolbar"><span class="hint" id="status">先選取左側專案名稱，再點選月份設定執行期間。</span><div class="toolbar"><button class="btn" id="backup" type="button">下載備份</button><button class="btn" id="restore" type="button">上傳備份</button><input id="backup-file" type="file" accept=".json,application/json" hidden><button class="btn" id="excel">匯出 Excel</button><button class="btn" id="png">匯出 PNG</button><button class="btn" id="print">列印</button></div></div><div class="dimension-controls"><label>名稱欄寬 <input id="name-width" type="range" min="260" max="850" step="10"><output id="width-display"></output></label><label>專案列高 <input id="row-height" type="range" min="42" max="130" step="2"><output id="height-display"></output></label><button class="btn" id="reset-size" type="button">重設尺寸</button></div><div class="scroll"><div class="chart" id="chart"></div></div><div class="editor" id="editor"></div><div class="legend"><span><i class="pill"></i> 色塊代表執行月份，相鄰月份自動合併</span><span>｜點擊已填色的月份可取消</span><span>｜使用 ↑ ↓ 調整順序</span></div></section><div class="foot">資料僅存於此瀏覽器的本機儲存空間（localStorage）；清除網站資料、使用無痕模式或更換裝置可能導致資料消失。建議定期使用「下載備份」保存可還原的 JSON 資料檔；Excel 是可編輯的表格輸出，但不作為網頁資料還原格式。</div></div><canvas id="export-canvas"></canvas>
<script>
(()=>{'use strict';
const PALETTE=['#9DAFA3','#C9A6A1','#A5AEC4','#C2B397','#B8A6BD','#8FB9B5','#D0BCAD','#A7B5A0','#D2B3C3','#9BAAB4'];
const KEY='morandi_gantt_v13_2026';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||typeof data!=='object')data={year:new Date().getFullYear(),years:{}};if(!data.years||typeof data.years!=='object')data.years={};let selected=null; if(!data.layout||typeof data.layout!=="object")data.layout={};data.layout.nameWidth=Math.min(850,Math.max(260,Number(data.layout.nameWidth)||460));data.layout.rowHeight=Math.min(130,Math.max(42,Number(data.layout.rowHeight)||64));
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeColor=s=>/^#[0-9a-f]{6}$/i.test(s)?s:'#9DAFA3';const yearKey=()=>String(data.year);const items=()=>{if(!Array.isArray(data.years[yearKey()]))data.years[yearKey()]=[];return data.years[yearKey()]};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('儲存失敗：瀏覽器空間不足或禁止本機儲存。')}};const uid=()=>String(Date.now())+'_'+Math.random().toString(36).slice(2);
function ranges(months){const out=[];let start=-1;for(let i=0;i<=12;i++){let active=i<12&&months.includes(i+1);if(active&&start<0)start=i;if(!active&&start>=0){out.push([start,i-start]);start=-1}}return out}
function applySizes(){const w=data.layout.nameWidth,h=data.layout.rowHeight;$("#chart").style.setProperty("--name-width",w+"px");$("#chart").style.setProperty("--row-height",h+"px");$("#name-width").value=w;$("#row-height").value=h;$("#width-display").textContent=w+"px";$("#height-display").textContent=h+"px";document.documentElement.style.setProperty("--name-width",w+"px");document.documentElement.style.setProperty("--row-height",h+"px")}function render(){applySizes();const rows=items();$('#year').value=data.year;let html='<div class="chart-head"><div>專案名稱</div><div class="resize-edge" title="拖曳調整名稱欄寬"></div>'+Array.from({length:12},(_,i)=>`<div>${i+1}月</div>`).join('')+'</div>';if(!rows.length)html+='<div class="empty">這一年還沒有專案，按「＋ 新增專案」開始規劃。</div>';rows.forEach((p,i)=>{p.months=Array.isArray(p.months)?p.months.filter(n=>Number.isInteger(n)&&n>=1&&n<=12):[];p.color=safeColor(p.color);html+=`<div class="chart-row ${selected===p.id?'selected':''}"><div class="name-cell"><span class="dot" style="background:${p.color}"></span><button class="project-select" data-id="${esc(p.id)}" title="${esc(p.name)}">${esc(p.name)}</button><button class="move" data-move="-1" data-id="${esc(p.id)}" aria-label="向上移動" ${i===0?'disabled':''}>↑</button><button class="move" data-move="1" data-id="${esc(p.id)}" aria-label="向下移動" ${i===rows.length-1?'disabled':''}>↓</button></div><div class="months">`;for(let m=1;m<=12;m++)html+=`<button class="month" data-month="${m}" data-id="${esc(p.id)}" aria-label="${esc(p.name)} ${m}月" title="${m}月：${p.months.includes(m)?'取消':'加入'}執行"></button>`;for(const [start,len] of ranges(p.months))html+=`<div class="bar" style="left:${start/12*100}%;width:${len/12*100}%;background:${p.color}"></div>`;html+='</div></div>'});$('#chart').innerHTML=html;const p=rows.find(x=>x.id===selected);$('#editor').classList.toggle('visible',!!p);$('#status').innerHTML=p?`目前選取：<b>${esc(p.name)}</b> — 點擊月份即可切換`: '先選取左側專案名稱，再點選月份設定執行期間。';if(p){$('#editor').innerHTML=`<div class="editor-head"><strong>編輯專案</strong><button class="btn danger" id="delete">刪除此專案</button></div><div class="editor-grid"><label class="field">專案名稱<input id="project-name" type="text" maxlength="120" value="${esc(p.name)}"></label><label class="field">選色器<input id="project-picker" type="color" value="${p.color}"></label><label class="field">自訂 HEX 色碼<input id="project-hex" type="text" maxlength="7" placeholder="#AABBCC" value="${p.color}"></label><div class="field">莫蘭迪色票<div class="swatches">${PALETTE.map(c=>`<button class="swatch" type="button" data-color="${c}" title="${c}" style="background:${c}"></button>`).join('')}</div></div></div>`}else $('#editor').innerHTML=''}
$('#chart').addEventListener('click',e=>{const move=e.target.closest('[data-move]');if(move){const id=move.dataset.id,idx=items().findIndex(p=>p.id===id),next=idx+Number(move.dataset.move);if(next>=0&&next<items().length){[items()[idx],items()[next]]=[items()[next],items()[idx]];save();render()}return}const sel=e.target.closest('.project-select');if(sel){selected=sel.dataset.id;render();return}const cell=e.target.closest('[data-month]');if(cell){if(selected!==cell.dataset.id){selected=cell.dataset.id;render();return}const p=items().find(x=>x.id===selected),m=Number(cell.dataset.month);if(!p)return;p.months=p.months.includes(m)?p.months.filter(x=>x!==m):[...p.months,m].sort((a,b)=>a-b);save();render()}});
for(const [id,key,min,max] of [["name-width","nameWidth",260,850],["row-height","rowHeight",42,130]]){$("#"+id).addEventListener("input",e=>{data.layout[key]=Math.min(max,Math.max(min,Number(e.target.value)));applySizes();save()})}$("#reset-size").onclick=()=>{data.layout={nameWidth:460,rowHeight:64};applySizes();save()};let dragStart=null;$("#chart").addEventListener("pointerdown",e=>{if(!e.target.classList.contains("resize-edge"))return;dragStart={x:e.clientX,w:data.layout.nameWidth,id:e.pointerId};e.target.setPointerCapture(e.pointerId);e.preventDefault()});$("#chart").addEventListener("pointermove",e=>{if(!dragStart)return;data.layout.nameWidth=Math.max(260,Math.min(850,Math.round((dragStart.w+e.clientX-dragStart.x)/10)*10));applySizes()});function stopResize(){if(dragStart){dragStart=null;save()}}$("#chart").addEventListener("pointerup",stopResize);$("#chart").addEventListener("pointercancel",stopResize);
$('#add').onclick=()=>{const a=items();const p={id:uid(),name:'新專案 '+(a.length+1),color:PALETTE[a.length%PALETTE.length],months:[]};a.push(p);selected=p.id;save();render();$('#project-name')?.focus();$('#project-name')?.select()};$('#year').addEventListener('change',e=>{const n=Number(e.target.value);if(!Number.isInteger(n)||n<1900||n>2200){e.target.value=data.year;return}data.year=n;selected=null;save();render()});$('#editor').addEventListener('input',e=>{const p=items().find(x=>x.id===selected);if(!p)return;if(e.target.id==='project-name'){p.name=e.target.value;save();document.querySelector('.chart-row.selected .project-select').textContent=p.name;$('#status').innerHTML=`目前選取：<b>${esc(p.name)}</b> — 點擊月份即可切換`}if(e.target.id==='project-picker'){p.color=safeColor(e.target.value);save();render()}if(e.target.id==='project-hex'&&/^#[0-9a-f]{6}$/i.test(e.target.value)){p.color=e.target.value;save();render()}});$('#editor').addEventListener('change',e=>{if(e.target.id==='project-name')render()});$('#editor').addEventListener('click',e=>{const p=items().find(x=>x.id===selected);if(!p)return;const sw=e.target.closest('[data-color]');if(sw){p.color=sw.dataset.color;save();render()}if(e.target.id==='delete'&&confirm(`確定要刪除「${p.name}」嗎？此動作無法復原。`)){data.years[yearKey()]=items().filter(x=>x.id!==selected);selected=null;save();render()}});
function segments(){return items().map(p=>({...p,months:[...p.months].sort((a,b)=>a-b)}))}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
// Portable backup includes all years, project data, colors and layout settings.
$('#backup').onclick=()=>{
 const payload={format:'morandi-gantt-backup',version:1,exportedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data))};
 downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),`甘特圖_完整備份_${new Date().toISOString().slice(0,10)}.json`);
};
$('#restore').onclick=()=>{$('#backup-file').value='';$('#backup-file').click()};
$('#backup-file').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(file.size>5*1024*1024){alert('備份檔超過 5MB，無法匯入。');return}
 let parsed;
 try{parsed=JSON.parse(await file.text())}catch(err){alert('無法讀取檔案：請選擇由本工具下載的 JSON 備份檔。');return}
 if(parsed?.format!=='morandi-gantt-backup'||parsed.version!==1||!parsed.data||typeof parsed.data!=='object'){
   alert('檔案格式不符，請使用本工具的「下載備份」產生的 JSON 檔。');return;
 }
 const d=parsed.data;
 if(!Number.isInteger(d.year)||d.year<1900||d.year>2200||!d.years||typeof d.years!=='object'||Array.isArray(d.years)){
   alert('備份內容不正確，未匯入任何資料。');return;
 }
 let count=0;
 for(const [year,projects] of Object.entries(d.years)){
   if(!/^\d{4}$/.test(year)||!Array.isArray(projects)||projects.length>5000){alert('備份內的年份或專案清單無效。');return}
   for(const project of projects){
     if(!project||typeof project!=='object'||typeof project.id!=='string'||project.id.length>200||typeof project.name!=='string'||project.name.length>120||typeof project.color!=='string'||!/^#[0-9a-f]{6}$/i.test(project.color)||!Array.isArray(project.months)||project.months.some(m=>!Number.isInteger(m)||m<1||m>12)){
       alert('備份中有不正確的專案資料，未匯入任何資料。');return;
     }
     count++;
   }
 }
 if(!confirm(`即將匯入 ${Object.keys(d.years).length} 個年份、${count} 個專案。\n\n這會覆蓋目前這台電腦的全部甘特圖資料及欄位尺寸。建議先下載現有資料備份。\n\n確定要繼續嗎？`))return;
 const layout=d.layout&&typeof d.layout==='object'?d.layout:{};
 const replacement={year:d.year,years:d.years,layout:{nameWidth:Math.min(850,Math.max(260,Number(layout.nameWidth)||460)),rowHeight:Math.min(130,Math.max(42,Number(layout.rowHeight)||64))}};
 try{localStorage.setItem(KEY,JSON.stringify(replacement))}catch(err){alert('匯入失敗：瀏覽器無法儲存資料，原有資料已保留。');return}
 data=replacement;selected=null;render();alert(`匯入完成！已還原 ${count} 個專案及欄位尺寸。`);
});
function round(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
$('#png').onclick=()=>{const rows=segments(),scale=2,W=Math.max(1860,data.layout.nameWidth+1330),left=data.layout.nameWidth+70,col=(W-left)/12,rowH=Math.max(66,data.layout.rowHeight),top=142,H=Math.max(240,top+Math.max(1,rows.length)*rowH+58);const c=$('#export-canvas');c.width=W*scale;c.height=H*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#FFFEFA';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4d514e';ctx.font='bold 30px sans-serif';ctx.fillText(data.year+' 年度專案甘特圖',35,56);ctx.fillStyle='#7d837e';ctx.font='15px sans-serif';ctx.fillText('PROJECT TIMELINE',35,83);ctx.fillStyle='#767d77';ctx.font='17px sans-serif';ctx.fillText('專案名稱',35,top-20);for(let m=1;m<=12;m++){ctx.textAlign='center';ctx.fillText(m+'月',left+(m-.5)*col,top-20)}ctx.textAlign='left';ctx.strokeStyle='#ebeae4';ctx.lineWidth=1;for(let i=0;i<=12;i++){const x=left+i*col;ctx.beginPath();ctx.moveTo(x,top-4);ctx.lineTo(x,top+rows.length*rowH);ctx.stroke()}const wrapLines=(name,maxWidth)=>{const lines=[];let line='';for(const ch of Array.from(name)){if(line&&ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines.length?lines:['']};rows.forEach((p,i)=>{const y=top+i*rowH;ctx.beginPath();ctx.moveTo(22,y+rowH-1);ctx.lineTo(W-22,y+rowH-1);ctx.stroke();ctx.fillStyle=safeColor(p.color);round(ctx,34,y+rowH/2-6,12,12,6);ctx.fillStyle='#4d514e';ctx.font='17px sans-serif';const lines=wrapLines(p.name,left-75);const lh=21;let fontSize=17;if(lines.length>3){fontSize=13;ctx.font='13px sans-serif'}const renderLines=wrapLines(p.name,left-75);let yy=y+rowH/2-(renderLines.length-1)*lh/2+6;renderLines.forEach(line=>{ctx.fillText(line,55,yy);yy+=lh});ctx.fillStyle=safeColor(p.color);ranges(p.months).forEach(([s,len])=>round(ctx,left+s*col+3,y+rowH/2-12,len*col-6,24,12))});c.toBlob(blob=>blob&&downloadBlob(blob,`甘特圖_${data.year}.png`),'image/png')};
// Genuine editable XLSX, packed locally using uncompressed ZIP entries (no network needed).
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}

$('#excel').onclick=()=>{const xmlEsc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const rows=segments();const unique=[...new Set(rows.map(p=>safeColor(p.color).toUpperCase()))];const hex=c=>c.replace('#','FF');let fills='<fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+unique.map(c=>`<fill><patternFill patternType="solid"><fgColor rgb="${hex(c)}"/><bgColor indexed="64"/></patternFill></fill>`).join('');const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF57655D"/><name val="Calibri"/></font></fonts><fills count="${2+unique.length}">${fills}</fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${2+unique.length}"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/>${unique.map((_,i)=>`<xf numFmtId="0" fontId="0" fillId="${i+2}" borderId="0" xfId="0"/>`).join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;let rowXML='<row r="1" ht="26" customHeight="1"><c r="A1" s="1" t="inlineStr"><is><t>專案名稱</t></is></c>'+Array.from({length:12},(_,i)=>`<c r="${String.fromCharCode(66+i)}1" s="1" t="inlineStr"><is><t>${i+1}月</t></is></c>`).join('')+'</row>';rows.forEach((p,i)=>{let r=i+2;rowXML+=`<row r="${r}" ht="29" customHeight="1"><c r="A${r}" t="inlineStr"><is><t>${xmlEsc(p.name)}</t></is></c>`;for(let m=1;m<=12;m++){let col=String.fromCharCode(65+m);if(p.months.includes(m)){const style=2+unique.indexOf(safeColor(p.color).toUpperCase());rowXML+=`<c r="${col}${r}" s="${style}" t="inlineStr"><is><t>●</t></is></c>`}
